name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills
        run: python3 scripts/validate.py
      - name: Script self-tests
        run: |
          python3 skills/giveaway-random-draw/scripts/draw.py --self-test
          python3 skills/giveaway-prize-picker/scripts/budget.py --self-test
          python3 skills/giveaway-winner-structure/scripts/terms.py --self-test
          python3 skills/giveaway-results-review/scripts/review.py --self-test
          python3 skills/giveaway-prize-picker/scripts/roi.py --self-test
          python3 skills/giveaway-results-review/scripts/gleam_export.py --self-test
          python3 skills/giveaway-results-review/scripts/campaign_report.py --self-test
          python3 skills/giveaway-results-review/scripts/dashboard.py --self-test
          python3 evals/style_check.py --self-test
          python3 evals/test_privacy_floor.py
          python3 evals/test_validate_versions.py
          python3 evals/test_check_deliverable.py
          python3 evals/test_export_to_draw.py
          python3 scripts/check_claims.py --self-test
      - name: Style rules on prose
        run: python3 scripts/style_lint.py

      - name: Shared blocks in sync
        run: python3 scripts/render_shared.py --check

      - name: Claims agree with their tables
        run: python3 scripts/check_claims.py
      - name: Committed figures
        run: python3 scripts/check_data.py
      - name: Aggregates only
        run: |
          # CSVs and synthetic addresses are allowed only in reviewed fixtures.
          # This also rejects symlinks and unexpected file types.
          python3 scripts/privacy_floor.py
