name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills
        run: python3 scripts/validate.py
      - name: Script self-tests
        run: |
          set -euo pipefail
          export PYTHONWARNINGS=error::ResourceWarning
          resource_check() {
            local log
            log=$(mktemp)
            python3 -W error::ResourceWarning "$@" 2>&1 | tee "$log"
            # Finalizer exceptions can be printed even when Python exits successfully.
            if grep -Eq 'ResourceWarning|Exception ignored' "$log"; then
              rm -f "$log"
              return 1
            fi
            rm -f "$log"
          }
          for script in skills/*/scripts/*.py; do
            resource_check "$script" --self-test
          done
          resource_check evals/style_check.py --self-test
          for test in evals/test_*.py; do
            resource_check "$test"
          done
          resource_check scripts/check_claims.py --self-test
      - name: Style rules on prose
        run: python3 scripts/style_lint.py

      - name: Shared blocks in sync
        run: python3 scripts/render_shared.py --check

      - name: Claims agree with their tables
        run: python3 scripts/check_claims.py
      - name: Committed figures
        run: python3 scripts/check_data.py
      - name: Aggregates only
        run: |
          # CSVs and synthetic addresses are allowed only in reviewed fixtures.
          # This also rejects symlinks and unexpected file types.
          python3 scripts/privacy_floor.py
